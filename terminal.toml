# Terminal Emulator Configuration
# Place this file as terminal.toml in your project directory
# or ~/.config/terminal/config.toml for global settings.

[font]
# family is resolved via fontconfig (fc-match); falls back to the embedded
# JetBrains Mono when not installed. `path` overrides family entirely.
family = "JetBrains Mono"
size = 15.0
# path = "/path/to/font.ttf"
# bold_path = "/path/to/font-bold.ttf"
# italic_path = "/path/to/font-italic.ttf"
ligatures = true

 [window]
title = "Terminal"
cols = 80
rows = 24
padding = 0
opacity = 1.0
decorations = true
always_on_top = false
vsync = true
blur = false
rounded_corners = false

[colors]
# Use a built-in theme name or customize colors directly.
# Available themes: "Catppuccin Mocha", "Catppuccin Latte", "Catppuccin Frappe",
# "Catppuccin Macchiato", "Gruvbox Dark", "Gruvbox Light", "Dracula",
# "Tokyo Night", "Tokyo Night Storm", "Nord", "Solarized Dark",
# "Solarized Light", "One Dark", "Monokai", "GitHub Dark", "GitHub Light"

# Catppuccin Mocha (default)
background = "#1E1E2E"
foreground = "#CDD6F4"
cursor = "#F5E0DC"
cursor_text = "#1E1E2E"
selection_bg = "#585B70"
selection_fg = "#CDD6F4"

# Optional: override bold/dim colors
# bold = "#FFFFFF"
# dim = "#888888"
ansi = [
    "#45475A",  # Black
    "#F38BA8",  # Red
    "#A6E3A1",  # Green
    "#F9E2AF",  # Yellow
    "#89B4FA",  # Blue
    "#F5C2E7",  # Magenta
    "#94E2D5",  # Cyan
    "#BAC2DE",  # White
    "#585B70",  # Bright Black
    "#F38BA8",  # Bright Red
    "#A6E3A1",  # Bright Green
    "#F9E2AF",  # Bright Yellow
    "#89B4FA",  # Bright Blue
    "#F5C2E7",  # Bright Magenta
    "#94E2D5",  # Bright Cyan
    "#A6ADC8",  # Bright White
]

# Optional: override bold/dim colors
# bold = "#FFFFFF"
# dim = "#888888"

[keyboard]
# Custom key bindings
# bindings = [
#     { key = "Ctrl+Shift+C", action = "copy" },
#     { key = "Ctrl+Shift+V", action = "paste" },
# ]

# Shell to run (defaults to $SHELL or /bin/bash)
# shell = "/bin/bash"

# Scrollback buffer size (lines)
scrollback = 10000

# Enable mouse reporting by default
mouse_reporting = false

# Cursor blink interval in milliseconds (0 = no blink)
cursor_blink_ms = 500

# SGR text blink interval in milliseconds (0 = no blink; rendered solid)
text_blink_ms = 500

# Bell feedback: "flash", "audible", or "none"
bell = "flash"

# Cursor style: "block", "bar", or "underline"
cursor_style = "block"

[tabs]
# Show the tab bar (visible automatically when more than one tab is open)
show_tab_bar = true
# Tab bar height in pixels
height = 30
